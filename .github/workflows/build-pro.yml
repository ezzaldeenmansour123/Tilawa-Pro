# Build Tilawa Pro APK — تلاوة برو
#
# العلامة التجارية محسومة (2026-11-25):
# - اسم العرض: «تلاوة برو»، applicationId: com.tilawa.app.tilawa_pro
#   (تطبيق مستقل بجانب تلاوة الأصلية com.tilawa.app.tilawa، فيُثبَّت
#   معها على جهاز واحد ولا يستبدلها ولا يمسّ بياناتها). لا تغيّر هذه
#   القيمة بعد أول إصدار مثبَّت أبداً — تغييرها يفرض إعادة تثبيت
#   وفقدان بيانات المستخدمين.
# - بناء تجريبي موقَّع بمفتاح التصحيح (debug) فقط — لا خطوة keystore.
# - الملف المنشور: Tilawa-Pro.apk، والوسم pro-build-N.
#
# الفروق عن build.yml الأصلي (تلاوة v1.0.0):
# 1. Java 21 لا 17 — AGP 9.3.1 ينهار على Java 17 في lintVital
#    (List.removeLast NoSuchMethodError؛ انظر poc.yml، التشغيل #8).
# 2. لا يوجد `rm -rf test` إطلاقاً — الاختبارات جزء من البناء، وتُشغَّل
#    في خطوة `flutter test` قبل التحليل. يُحذف فقط الملف المولَّد
#    test/widget_test.dart بعد flutter create (يرجع إلى MyApp غير
#    موجود فيكسر analyze) — ملفات test/ الخاصة بالمستودع لا تُمسّ.
# 3. خطوة Node 20 تبني حزمة الويب (web/ → assets/web/bundle.js)
#    لمحرك التسميع، وتليها خطوة فحص صريح لحجم الحزمة (أدنى 512KB —
#    درس poc-12: حزمة مفقودة/تالفة علّقت WebView صامتاً 120 ثانية)؛
#    والمعجم يُبنى داخل خطوة بناء قاعدة البيانات نفسها (--lexicon-qac
#    بعد جلب quran-morphology.txt والتحقق من بصمته — لا خطوة إرفاق
#    منفصلة في CI)؛ وخطوة أصول نموذج (model assets) لاختبار الدخان
#    في CI. الخطوات تفشل بصوت عالٍ إن غاب مصدرها — لا تخطٍّ صامت.
# 4. البناء arm64 فقط (--split-per-abi) وينشر app-arm64-v8a.
# 5. إذن RECORD_AUDIO في البيان — مطلوب لمحرك التسميع.
# 6. Network security config (2026-11-25): cleartext allowed ONLY to
#    127.0.0.1/localhost — the recitation engine's LocalServer. Without it
#    WebView refuses the page with net::ERR_CLEARTEXT_NOT_PERMITTED (the
#    root cause of every tasmee' start failure: poc-12 timeout, poc-14
#    bundle.js error, pro-build-24 bundle.js error — diagnosed 2026-11-25
#    23:41 from the user's screenshots).
#
# ترتيب الخطوات مهم: توليد الأصول أولاً (قاعدة البيانات + المعجم +
# الخطوط + حزمة الويب + أصول النموذج)، ثم pub get، ثم test، ثم
# analyze، ثم build. `flutter analyze` يفشل (exit 1) إن لم توجد
# الأصول المعلنة في pubspec.yaml، و`flutter test` يفشل في بناء
# حزمة الأصول للسبب نفسه.

name: Build Tilawa Pro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: AGP 9.3.1's lint (lintVitalAnalyzeRelease) calls
      # java.util.List.removeLast() (a Java 21 SequencedCollection API)
      # and crashes with NoSuchMethodError on JDK 17 (Tilawa-PoC run #8).
      # Flutter 3.50.1 / Gradle 9.5 run fine on JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Stable debug keystore — why: each GitHub runner generates a fresh
      # ~/.android/debug.keystore, so every build had a DIFFERENT signature
      # (proven 2026-11-25: pro-build-25, poc-14 and poc-15 all carry
      # different certificates). Android refuses to update an installed app
      # with a different signature, so pro-build-25 could not install over
      # pro-build-24 ("package appears to be invalid"). This step creates
      # ONE keystore on the first run, commits it to tools/debug.keystore,
      # and reuses it for every later build — so updates work from the next
      # build on. It is a DEBUG (trial) key with the public standard
      # credentials (android/androiddebugkey/android): it provides install
      # identity only, no security. A real release key (in GitHub Secrets)
      # must replace it before any store release. The installed pro-build-24
      # was signed with a lost per-run key, so users must uninstall it once
      # (export data first) and install the new build fresh.
      - name: Ensure stable debug keystore
        run: |
          KEYSTORE=tools/debug.keystore
          if [ -f "$KEYSTORE" ]; then
            echo 'Using committed stable debug keystore.'
          else
            echo 'No stable debug keystore yet — generating one (first run only).'
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname 'CN=Android Debug, O=Android, C=US'
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$KEYSTORE"
            git commit -m 'Add stable debug keystore so trial builds keep one signature [skip ci]' || echo 'nothing to commit'
            git push origin HEAD:main || {
              echo 'push failed — another run may have created it; taking the committed one'
              git fetch origin main
              git checkout origin/main -- "$KEYSTORE"
            }
          fi
          mkdir -p ~/.android
          cp "$KEYSTORE" ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | head -4

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable

      - name: Set up Node 20 (web bundle)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Quran datasets (pinned revisions)
        run: |
          pip install -q huggingface_hub pyarrow pandas pillow
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          d1 = snapshot_download(
              repo_id="quranlab/quran",
              repo_type="dataset",
              revision="b4e0edc2a0c8ffa6952c6f5fdf31a19acd75a068",
              allow_patterns=["arabic-uthmani/*.parquet", "arabic-simple-clean/*.parquet"])
          d2 = snapshot_download(
              repo_id="quranlab/quran-tafsir",
              repo_type="dataset",
              revision="1020ac515b158a1e718fe647dab73c0c77dd5a65",
              allow_patterns=["tafsir-muyassar-ar/*.parquet",
                              "tafsir-jalalayn-ar/*.parquet",
                              "tafsir-saadi-ar/*.parquet"])
          print("quran:", d1)
          print("tafsir:", d2)
          # build_db.py reads both dirs: it looks for the tafsir files
          # in the same data dir, so merge them.
          import shutil, os
          for root, dirs, files in os.walk(d2):
              for f in files:
                  src = os.path.join(root, f)
                  rel = os.path.relpath(src, d2)
                  dst = os.path.join(d1, rel)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copyfile(src, dst)
          with open("data_dir.txt", "w") as fh:
              fh.write(d1)
          PY

      # بيانات Quranic Arabic Corpus v0.4 للبحث المعجمي: معطَّلة مؤقتاً في
      # هذه النسخة التجريبية — جداول المعجم مشتقة من QAC (GPL) وشروط
      # استخدامه تنص «CHANGING IT IS NOT ALLOWED» + «purely for research»،
      # فيلزم تأكيد قانوني/إذن كتابي قبل التوزيع (انظر NOTICE.md وقرار
      # المستخدم 2026-11-25). الكود والتحقق 41/41 جاهزان في المشروع؛
      # لإعادة التفعيل بعد التأكيد: أعد هاتين الخطوتين (الجلب + العلم
      # --lexicon-qac أدناه). بدون المعجم يعود البحث تلقائياً إلى FTS5
      # القديم (main.dart يفحص lexiconAvailable()).
      # - name: Download QAC morphology data (pinned mirror)
      #   run: |
      #     curl -L -o quran-morphology.txt \
      #       https://raw.githubusercontent.com/mustafa0x/quran-morphology/8f38b39/quran-morphology.txt
      #     echo '742bfac59941b2cb09736d5b7aae694af50792261fb8450cbf6afafcc340645f  quran-morphology.txt' | sha256sum -c -
      #     ls -lh quran-morphology.txt

      - name: Build Quran database
        run: |
          python3 tools/build_db.py "$(cat data_dir.txt)" assets/quran.db \
            b4e0edc2a0c8ffa6952c6f5fdf31a19acd75a068 \
            1020ac515b158a1e718fe647dab73c0c77dd5a65
          ls -lh assets/quran.db assets/quran.db.sha256

      # ملاحظة: tools/attach_lexicon.py هو المكافئ المحلي (يُرفق الجداول
      # بقاعدة مبنية أصلاً من نسخة Phase-1 الموثقة) — لا يُستدعى في CI،
      # لأن CI يبني المعجم من الصفر بالخطوتين أعلاه.

      - name: Download Amiri fonts
        run: |
          mkdir -p assets/fonts
          curl -sL -o assets/fonts/Amiri-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          curl -sL -o assets/fonts/Amiri-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          ls -lh assets/fonts/

      # حزمة الويب لمحرك التسميع (yazinsai/tilawa عبر WebView).
      # مصادر web/ يضيفها وكيل آخر؛ هذه الخطوة تفشل بصوت عالٍ إن
      # غاب المصدر، وتبني الحزمة وتتحقق من وجود الملف الناتج.
      # `npm ci` لا `npm install`: web/package-lock.json مثبَّت (وُلّد 2026-11-25،
      # البند 2.4 من المرحلة 2) فيُثبَّت في CI بالضبط ما اختُبر محلياً.
      - name: Build web bundle (recitation engine)
        run: |
          if [ ! -d web ] || [ ! -f web/package.json ]; then
            echo 'ERROR: web/ sources are missing — the recitation web bundle cannot be built. Failing loudly instead of shipping Pro without the recitation engine.'
            exit 1
          fi
          cd web
          npm ci
          npm run build
          test -s ../assets/web/bundle.js
          # Actually EVALUATE the bundle in Node (web/smoke-bundle.mjs):
          # `test -s` only proves the file is non-empty — a bundle that
          # throws during evaluation dies before defining window.TilawaPro
          # (the poc-14 failure mode) and would still pass `test -s`.
          node smoke-bundle.mjs
          # Early env-probe unit tests (2026-11-26 JSEP/WASM repair):
          # web/test-env-probe.mjs exercises web/src/env_probe.js in
          # Node with shims — no WebView needed. The probe is what names
          # the cause of the next failed load, so its own tests gate the
          # build like the smoke test does.
          node test-env-probe.mjs
          ls -lh ../assets/web/bundle.js

      # فحص صريح لحجم حزمة الويب — درس poc-12: تهيئة WebView للمحرك
      # علّقت صامتاً 120 ثانية ثم فشلت بمهلة تحميل النموذج، وكانت
      # الحزمة المفقودة/التالفة لا يكشفها البناء. هذا الفحص يفشل
      # البناء هنا، قبل أي APK، إن غابت الحزمة أو كانت فارغة أو
      # صغيرة بشكل مشبوه.
      # الحجم الفعلي المقاس محلياً 2026-11-25: 1,040,578 بايت
      # (@tilawa/core 1.0.0-rc.1 + onnxruntime-web 1.30.0، مصغَّرة
      # عبر esbuild). الحد الأدنى 512,000 بايت (~نصف الحجم الفعلي)
      # يتحمل انكماش إصدارات المحرك المقبلة، ويكشف في المقابل أي
      # ملف فارغ أو مختصر أو مولَّد جزئياً.
      - name: Verify web bundle size (fail if missing or tiny)
        run: |
          f=assets/web/bundle.js
          if [ ! -f "$f" ]; then
            echo "ERROR: $f is missing — the recitation engine bundle was not built. The local server would serve nothing and WebView init would hang silently (poc-12)."
            exit 1
          fi
          size=$(stat -c%s "$f")
          echo "bundle.js size: $size bytes"
          ls -lh "$f"
          if [ "$size" -lt 512000 ]; then
            echo "ERROR: $f is only $size bytes (minimum 512000) — suspiciously small for the minified @tilawa/core + onnxruntime-web bundle (measured 1040578 bytes on 2026-11-25). Failing instead of shipping a broken recitation engine."
            exit 1
          fi
          echo 'web bundle size OK'

      # أصول النموذج لاختبار الدخان في CI (النموذج الخفيف lite فقط —
      # 24 MB؛ النموذج الكامل full يُنزَّل داخل التطبيق عند الطلب).
      # السكربت يضيفه وكيل آخر (على نمط Tilawa-PoC)؛ هذه الخطوة
      # تستدعيه إن وُجد، وتفشل بصوت عالٍ إن غاب.
      # 2026-11-26: يُنزَّل النموذج الكامل full أيضاً (67.8 MB في CI
      # مقبول) — لكن لفحص ONNX I/O فقط، لا للشحن: assets/models/ غير
      # معلنة في pubspec.yaml فلا تُضمَّن في APK إطلاقاً.
      - name: Download model assets (lite + full tiers, SHA-verified)
        run: |
          if [ ! -f tools/download_assets.py ]; then
            echo 'ERROR: tools/download_assets.py is missing — the model-assets script has not been added yet. Failing loudly instead of building without the recitation model smoke-test assets.'
            exit 1
          fi
          python3 tools/download_assets.py --tier lite --out assets/models
          python3 tools/download_assets.py --tier full --out assets/models
          test -s assets/models/model-lite.onnx
          test -s assets/models/model-full.onnx
          ls -lh assets/models/

      # فحص ONNX I/O (2026-11-26، توجيه المستخدم): نجاح تحميل النموذج
      # ليس دليلاً على عمل التسميع. web/check_onnx_io.mjs ينشئ جلسة
      # InferenceSession حقيقية عبر onnxruntime-node لكل طبقة، ويتحقق
      # من أسماء/أنواع/أشكال المدخلات والمخرجات مقابل ما يغذّيه ويقرؤه
      # @tilawa/core بالضبط (x [1,45,80] + حالات البيان، وlog_probs +
      # new_*‎)، ثم يشغّل مسبر الإحماء. أي عدم تطابق يُفشل البناء.
      # بيئة تطوير فقط: النجاح هنا يجيب «هل تُنشأ الجلسة وهل يطابق
      # الإدخال/الإخراج» — ولا يثبت عمل التسميع على الهاتف إطلاقاً
      # (ذلك بروتوكول اختبار الهاتف المنفصل).
      - name: ONNX I/O check (both tiers)
        run: |
          node check_onnx_io.mjs \
            --model ../assets/models/model-lite.onnx \
            --manifest ../assets/models/manifest-lite.json \
            --tier lite
          node check_onnx_io.mjs \
            --model ../assets/models/model-full.onnx \
            --manifest ../assets/models/manifest-full.json \
            --tier full
        working-directory: web

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.tilawa.app --project-name tilawa_pro .
          # flutter create regenerates a default test/widget_test.dart
          # that references a MyApp class this project does not have —
          # it breaks `flutter analyze`. Delete ONLY that generated
          # file; the repo's own test/ files must never be deleted.
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')
          # ROOT FIX (diagnosed 2026-11-25 23:41, from the user's screenshots):
          # WebView failed with net::ERR_CLEARTEXT_NOT_PERMITTED on
          # http://127.0.0.1:<port>/tilawa.html — Android 9+ blocks cleartext
          # (plain HTTP) by default, so the recitation page never loaded at
          # all, bundle.js never ran, and the bridge never existed. That one
          # block is the root of the poc-12 timeout, the poc-14 bundle.js
          # error and the pro-build-24 bundle.js error. The fix is a network
          # security config that allows cleartext ONLY to the on-device local
          # server (127.0.0.1 / localhost) — the LocalServer binds loopback
          # only and serves the engine page, bundle and model files. No
          # other host is allowed cleartext. (A broad
          # android:usesCleartextTraffic="true" would also work but permits
          # cleartext everywhere — deliberately NOT used.)
          t = t.replace('android:label="tilawa_pro"',
                        'android:label="تلاوة برو"\n'
                        '        android:networkSecurityConfig="@xml/network_security_config"')
          assert 'android:networkSecurityConfig="@xml/network_security_config"' in t
          xml = Path('android/app/src/main/res/xml/network_security_config.xml')
          xml.parent.mkdir(parents=True, exist_ok=True)
          xml.write_text('<?xml version="1.0" encoding="utf-8"?>\n'
                         '<!-- Cleartext ONLY to the on-device local server. -->\n'
                         '<network-security-config>\n'
                         '  <domain-config cleartextTrafficPermitted="true">\n'
                         '    <domain includeSubdomains="true">127.0.0.1</domain>\n'
                         '    <domain includeSubdomains="true">localhost</domain>\n'
                         '  </domain-config>\n'
                         '</network-security-config>\n', encoding='utf-8')
          print('network security config OK (cleartext to 127.0.0.1/localhost only)')
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n')
          assert 'android.permission.INTERNET' not in t
          assert 'android.permission.RECORD_AUDIO' not in t
          t = t.replace('</manifest>', perms + '</manifest>')
          p.write_text(t, encoding='utf-8')
          print('manifest OK')
          # Enable core library desugaring (required by the notifications
          # plugin). compileSdk stays at Flutter's default 36: the
          # notifications plugin is pinned to 22.3.3 (see pubspec), the last
          # release that compiles against SDK 36 — 23.x needs SDK 37, which
          # the Actions runner cannot install.
          g = Path('android/app/build.gradle.kts')
          gt = g.read_text(encoding='utf-8')
          assert 'compileSdk = flutter.compileSdkVersion' in gt
          assert 'sourceCompatibility = JavaVersion.VERSION_17' in gt
          gt = gt.replace('sourceCompatibility = JavaVersion.VERSION_17',
                          'isCoreLibraryDesugaringEnabled = true\n'
                          '        sourceCompatibility = JavaVersion.VERSION_17')
          assert '}\n\nkotlin {' in gt
          gt = gt.replace('}\n\nkotlin {',
                          '}\n\ndependencies {\n'
                          '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                          '}\n\nkotlin {', 1)
          g.write_text(gt, encoding='utf-8')
          print('desugaring enabled')
          PY
          python3 tools/make_icon.py android/app/src/main/res

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Build release APK (arm64 only)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Tilawa-Pro.apk

      # The bundle was built, size-checked and smoke-tested above, but that
      # proves only that it exists on the runner — not that Flutter packaged
      # it into the APK. A missing asset here is exactly the poc-14 failure
      # mode (HTTP 500 from the local server, no bridge in the page).
      - name: Verify bundle.js inside APK (fail if missing or tiny)
        run: |
          apk=Tilawa-Pro.apk
          entry=$(unzip -l "$apk" | grep 'assets/flutter_assets/assets/web/bundle.js' || true)
          if [ -z "$entry" ]; then
            echo "ERROR: assets/flutter_assets/assets/web/bundle.js is NOT inside $apk — the local server would serve nothing and WebView init would fail (poc-14)."
            unzip -l "$apk" | grep 'assets/web/' || echo '(no assets/web/ entries in APK at all)'
            exit 1
          fi
          size=$(echo "$entry" | awk '{print $1}')
          echo "bundle.js inside APK: $size bytes (uncompressed)"
          if [ "$size" -lt 512000 ]; then
            echo "ERROR: bundle.js inside APK is only $size bytes (minimum 512000) — suspiciously small for the minified @tilawa/core + onnxruntime-web bundle (measured 1040578 bytes on 2026-11-25)."
            exit 1
          fi
          echo 'bundle.js inside APK OK'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawa-pro-apk
          path: Tilawa-Pro.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pro-build-${{ github.run_number }}
          name: Tilawa Pro build ${{ github.run_number }}
          files: Tilawa-Pro.apk

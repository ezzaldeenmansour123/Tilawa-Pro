name: Build Tilawa APK

# مُعطَّل عن التشغيل التلقائي — هذا سير عمل تلاوة v1.0.0 الأصلية.
# في مستودع تلاوة برو يُبنى التطبيق عبر build-pro.yml فقط (وسم pro-build-N
# وملف Tilawa-Pro.apk). هذا الملف محفوظ للرجوع إليه ولا يُشغَّل إلا يدوياً.
# لا تعده إلى push قبل مراجعة فروقه عن build-pro.yml (أهمها: `rm -rf test`).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable

      - name: Download Quran datasets (pinned revisions)
        run: |
          pip install -q huggingface_hub pyarrow pandas pillow
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          d1 = snapshot_download(
              repo_id="quranlab/quran",
              repo_type="dataset",
              revision="b4e0edc2a0c8ffa6952c6f5fdf31a19acd75a068",
              allow_patterns=["arabic-uthmani/*.parquet", "arabic-simple-clean/*.parquet"])
          d2 = snapshot_download(
              repo_id="quranlab/quran-tafsir",
              repo_type="dataset",
              revision="1020ac515b158a1e718fe647dab73c0c77dd5a65",
              allow_patterns=["tafsir-muyassar-ar/*.parquet",
                              "tafsir-jalalayn-ar/*.parquet",
                              "tafsir-saadi-ar/*.parquet"])
          print("quran:", d1)
          print("tafsir:", d2)
          # build_db.py reads both dirs: it looks for the tafsir files
          # in the same data dir, so merge them.
          import shutil, os
          for root, dirs, files in os.walk(d2):
              for f in files:
                  src = os.path.join(root, f)
                  rel = os.path.relpath(src, d2)
                  dst = os.path.join(d1, rel)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copyfile(src, dst)
          with open("data_dir.txt", "w") as fh:
              fh.write(d1)
          PY

      - name: Build Quran database
        run: |
          python3 tools/build_db.py "$(cat data_dir.txt)" assets/quran.db \
            b4e0edc2a0c8ffa6952c6f5fdf31a19acd75a068 \
            1020ac515b158a1e718fe647dab73c0c77dd5a65
          ls -lh assets/quran.db assets/quran.db.sha256

      - name: Download Amiri fonts
        run: |
          mkdir -p assets/fonts
          curl -sL -o assets/fonts/Amiri-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          curl -sL -o assets/fonts/Amiri-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          ls -lh assets/fonts/

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.tilawa.app --project-name tilawa .
          rm -rf test
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text(encoding='utf-8')
          t = t.replace('android:label="tilawa"', 'android:label="تلاوة"')
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n')
          assert 'android.permission.INTERNET' not in t
          t = t.replace('</manifest>', perms + '</manifest>')
          p.write_text(t, encoding='utf-8')
          print('manifest OK')
          # Enable core library desugaring (required by the notifications
          # plugin). compileSdk stays at Flutter's default 36: the
          # notifications plugin is pinned to 22.3.3 (see pubspec), the last
          # release that compiles against SDK 36 — 23.x needs SDK 37, which
          # the Actions runner cannot install.
          g = Path('android/app/build.gradle.kts')
          gt = g.read_text(encoding='utf-8')
          assert 'compileSdk = flutter.compileSdkVersion' in gt
          assert 'sourceCompatibility = JavaVersion.VERSION_17' in gt
          gt = gt.replace('sourceCompatibility = JavaVersion.VERSION_17',
                          'isCoreLibraryDesugaringEnabled = true\n'
                          '        sourceCompatibility = JavaVersion.VERSION_17')
          assert '}\n\nkotlin {' in gt
          gt = gt.replace('}\n\nkotlin {',
                          '}\n\ndependencies {\n'
                          '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n'
                          '}\n\nkotlin {', 1)
          g.write_text(gt, encoding='utf-8')
          print('desugaring enabled')
          PY
          python3 tools/make_icon.py android/app/src/main/res

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Tilawa.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilawa-apk
          path: Tilawa.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tilawa build ${{ github.run_number }}
          files: Tilawa.apk
